name: Daily Model Picks (Settle)

on:
  schedule:
    # Every 2 hours so picks settle soon after games complete.
    # We ingest first so settlement has the latest completed game results.
    - cron: "35 */2 * * *"
  workflow_dispatch:

jobs:
  settle:
    runs-on: ubuntu-latest

    env:
      DEPLOYED_API_URL: ${{ secrets.DEPLOYED_API_URL }}
      INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
      NBA_SEASON: ${{ secrets.NBA_SEASON }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Verify deployment secrets
        run: |
          test -n "$DEPLOYED_API_URL"
          test -n "$INGEST_API_KEY"

      - name: Trigger AWS Lightsail ingestion (pre-settlement)
        run: |
          SEASON="${NBA_SEASON:-2025-26}"
          curl --fail-with-body --show-error --silent --max-time 240 \
            --request POST \
            --header "X-API-Key: $INGEST_API_KEY" \
            "$DEPLOYED_API_URL/admin/ingest?season=$SEASON"

      - name: Trigger AWS Lightsail picks settlement
        run: |
          curl --fail-with-body --show-error --silent --max-time 240 \
            --request POST \
            --header "X-API-Key: $INGEST_API_KEY" \
            "$DEPLOYED_API_URL/admin/picks/settle"
